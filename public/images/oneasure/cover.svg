<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" width="1200" height="750" role="img" aria-labelledby="t">
  <title id="t">Three separate HR portals, each with its own login, consolidated into one portal with a single sign-on and modular navigation</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f6f7f9"/>
      <stop offset="1" stop-color="#e9ebef"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#0f172a" flood-opacity="0.10"/>
    </filter>
  </defs>
  <rect width="1200" height="750" fill="url(#bg)"/>
  <g stroke="#0f172a" stroke-opacity="0.05">
    <path d="M0 150H1200M0 300H1200M0 450H1200M0 600H1200M200 0V750M400 0V750M600 0V750M800 0V750M1000 0V750"/>
  </g>

  <!-- three separate portals -->
  <g font-family="Inter, Arial, sans-serif" filter="url(#shadow)">
    <g>
      <rect x="110" y="150" width="300" height="120" rx="14" fill="#ffffff" stroke="#0f172a" stroke-opacity="0.12"/>
      <text x="140" y="200" font-size="20" font-weight="700" fill="#0f172a">Time &amp; Attendance</text>
      <rect x="140" y="222" width="150" height="10" rx="5" fill="#0f172a" fill-opacity="0.15"/>
      <g transform="translate(360 196)"><rect x="-12" y="-4" width="24" height="18" rx="4" fill="#c2410c"/><path d="M-7 -4v-6a7 7 0 0 1 14 0v6" fill="none" stroke="#c2410c" stroke-width="3"/></g>
    </g>
    <g>
      <rect x="110" y="315" width="300" height="120" rx="14" fill="#ffffff" stroke="#0f172a" stroke-opacity="0.12"/>
      <text x="140" y="365" font-size="20" font-weight="700" fill="#0f172a">Benefits</text>
      <rect x="140" y="387" width="190" height="10" rx="5" fill="#0f172a" fill-opacity="0.15"/>
      <g transform="translate(360 361)"><rect x="-12" y="-4" width="24" height="18" rx="4" fill="#c2410c"/><path d="M-7 -4v-6a7 7 0 0 1 14 0v6" fill="none" stroke="#c2410c" stroke-width="3"/></g>
    </g>
    <g>
      <rect x="110" y="480" width="300" height="120" rx="14" fill="#ffffff" stroke="#0f172a" stroke-opacity="0.12"/>
      <text x="140" y="530" font-size="20" font-weight="700" fill="#0f172a">Payroll</text>
      <rect x="140" y="552" width="120" height="10" rx="5" fill="#0f172a" fill-opacity="0.15"/>
      <g transform="translate(360 526)"><rect x="-12" y="-4" width="24" height="18" rx="4" fill="#c2410c"/><path d="M-7 -4v-6a7 7 0 0 1 14 0v6" fill="none" stroke="#c2410c" stroke-width="3"/></g>
    </g>
  </g>
  <text x="260" y="665" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="700" letter-spacing="3" fill="#c2410c" text-anchor="middle">THREE LOGINS</text>

  <!-- converging lines -->
  <g fill="none" stroke="#f97415" stroke-opacity="0.6" stroke-width="3" stroke-linecap="round">
    <path d="M410 210C500 210 520 375 600 375"/>
    <path d="M410 375H600"/>
    <path d="M410 540C500 540 520 375 600 375"/>
  </g>
  <circle cx="600" cy="375" r="7" fill="#f97415"/>
  <path d="M607 375H650" stroke="#f97415" stroke-opacity="0.6" stroke-width="3"/>

  <!-- one portal -->
  <g filter="url(#shadow)">
    <rect x="650" y="130" width="440" height="490" rx="18" fill="#ffffff" stroke="#0f172a" stroke-opacity="0.12"/>
  </g>
  <path d="M668 130H1072a18 18 0 0 1 18 18V200H650V148a18 18 0 0 1 18-18z" fill="#13788a"/>
  <text x="740" y="174" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="700" fill="#ffffff">One portal</text>
  <text x="1050" y="173" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="700" fill="#ffffff" fill-opacity="0.8" text-anchor="end">Single sign-on</text>
  <!-- sidebar -->
  <rect x="650" y="200" width="70" height="420" fill="#0f172a" fill-opacity="0.03"/>
  <g fill="#13788a">
    <rect x="672" y="228" width="26" height="26" rx="7" fill-opacity="0.9"/>
    <rect x="672" y="280" width="26" height="26" rx="7" fill-opacity="0.25"/>
    <rect x="672" y="332" width="26" height="26" rx="7" fill-opacity="0.25"/>
    <rect x="672" y="384" width="26" height="26" rx="7" fill-opacity="0.25"/>
  </g>
  <!-- content -->
  <g font-family="Inter, Arial, sans-serif">
    <rect x="750" y="228" width="310" height="96" rx="12" fill="#13788a" fill-opacity="0.07" stroke="#13788a" stroke-opacity="0.35"/>
    <rect x="772" y="252" width="170" height="12" rx="6" fill="#0f172a" fill-opacity="0.7"/>
    <rect x="772" y="276" width="240" height="9" rx="4.5" fill="#0f172a" fill-opacity="0.2"/>
    <rect x="772" y="294" width="120" height="16" rx="8" fill="#13788a"/>
    <rect x="750" y="344" width="148" height="110" rx="12" fill="#ffffff" stroke="#0f172a" stroke-opacity="0.12"/>
    <rect x="912" y="344" width="148" height="110" rx="12" fill="#ffffff" stroke="#0f172a" stroke-opacity="0.12"/>
    <text x="770" y="378" font-size="13" font-weight="700" fill="#0f172a" fill-opacity="0.55">TIME</text>
    <text x="932" y="378" font-size="13" font-weight="700" fill="#0f172a" fill-opacity="0.55">PAY</text>
    <rect x="770" y="398" width="90" height="18" rx="6" fill="#0f172a" fill-opacity="0.8"/>
    <rect x="932" y="398" width="100" height="18" rx="6" fill="#0f172a" fill-opacity="0.8"/>
    <rect x="770" y="428" width="60" height="8" rx="4" fill="#0f172a" fill-opacity="0.2"/>
    <rect x="932" y="428" width="70" height="8" rx="4" fill="#0f172a" fill-opacity="0.2"/>
    <rect x="750" y="474" width="310" height="120" rx="12" fill="#ffffff" stroke="#0f172a" stroke-opacity="0.12"/>
    <text x="770" y="506" font-size="13" font-weight="700" fill="#0f172a" fill-opacity="0.55">BENEFITS</text>
    <rect x="770" y="524" width="200" height="9" rx="4.5" fill="#0f172a" fill-opacity="0.2"/>
    <rect x="770" y="546" width="160" height="9" rx="4.5" fill="#0f172a" fill-opacity="0.2"/>
    <rect x="770" y="568" width="180" height="9" rx="4.5" fill="#0f172a" fill-opacity="0.2"/>
  </g>
  <text x="870" y="665" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="700" letter-spacing="3" fill="#c2410c" text-anchor="middle">ONE PRODUCT</text>
</svg>
