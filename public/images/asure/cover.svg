<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" width="1200" height="750" role="img" aria-labelledby="t">
  <title id="t">Abstract compliance configuration: five linked entity types and a draft, review, locked, released lifecycle</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f6f7f9"/>
      <stop offset="1" stop-color="#e9ebef"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#0f172a" flood-opacity="0.10"/>
    </filter>
  </defs>
  <rect width="1200" height="750" fill="url(#bg)"/>
  <g stroke="#0f172a" stroke-opacity="0.05">
    <path d="M0 150H1200M0 300H1200M0 450H1200M0 600H1200M200 0V750M400 0V750M600 0V750M800 0V750M1000 0V750"/>
  </g>
  <!-- entity chain -->
  <path d="M200 260H1000" stroke="#f97415" stroke-opacity="0.55" stroke-width="3" fill="none"/>
  <g font-family="Inter, Arial, sans-serif" font-size="15" font-weight="700" fill="#0f172a" text-anchor="middle" filter="url(#shadow)">
    <g><rect x="120" y="200" width="160" height="120" rx="14" fill="#ffffff" stroke="#0f172a" stroke-opacity="0.12"/><text x="200" y="250" fill="#c2410c" font-size="26">01</text><text x="200" y="285">Tax Code</text></g>
    <g><rect x="320" y="200" width="160" height="120" rx="14" fill="#ffffff" stroke="#0f172a" stroke-opacity="0.12"/><text x="400" y="250" fill="#c2410c" font-size="26">02</text><text x="400" y="285">Payee</text></g>
    <g><rect x="520" y="200" width="160" height="120" rx="14" fill="#ffffff" stroke="#0f172a" stroke-opacity="0.12"/><text x="600" y="250" fill="#c2410c" font-size="26">03</text><text x="600" y="285">Formula</text></g>
    <g><rect x="720" y="200" width="160" height="120" rx="14" fill="#ffffff" stroke="#0f172a" stroke-opacity="0.12"/><text x="800" y="250" fill="#c2410c" font-size="26">04</text><text x="800" y="285">Filing Frequency</text></g>
    <g><rect x="920" y="200" width="160" height="120" rx="14" fill="#ffffff" stroke="#0f172a" stroke-opacity="0.12"/><text x="1000" y="250" fill="#c2410c" font-size="26">05</text><text x="1000" y="285">Holiday Calendar</text></g>
  </g>
  <!-- lifecycle -->
  <g font-family="Inter, Arial, sans-serif" font-size="17" font-weight="700" text-anchor="middle">
    <text x="600" y="430" fill="#c2410c" font-size="13" letter-spacing="3">REVISION LIFECYCLE</text>
    <rect x="180" y="470" width="190" height="72" rx="12" fill="#fef3c7" stroke="#d97706" stroke-opacity="0.6" stroke-width="2"/><text x="275" y="514" fill="#92400e">Draft</text>
    <path d="M370 506H410" stroke="#0f172a" stroke-opacity="0.3" stroke-width="3"/>
    <rect x="410" y="470" width="190" height="72" rx="12" fill="#dbeafe" stroke="#2563eb" stroke-opacity="0.6" stroke-width="2"/><text x="505" y="514" fill="#1e3a8a">In Review</text>
    <path d="M600 506H640" stroke="#0f172a" stroke-opacity="0.3" stroke-width="3"/>
    <rect x="640" y="470" width="190" height="72" rx="12" fill="#ffedd5" stroke="#f97415" stroke-opacity="0.8" stroke-width="2"/><text x="735" y="514" fill="#9a3412">Locked</text>
    <path d="M830 506H870" stroke="#0f172a" stroke-opacity="0.3" stroke-width="3"/>
    <rect x="870" y="470" width="190" height="72" rx="12" fill="#dcfce7" stroke="#16a34a" stroke-opacity="0.6" stroke-width="2"/><text x="965" y="514" fill="#14532d">Released</text>
  </g>
  <text x="600" y="640" font-family="Inter, Arial, sans-serif" font-size="18" fill="#0f172a" fill-opacity="0.55" text-anchor="middle">9,000+ tax agencies · one configuration model · UI state maps 1:1 to backend state</text>
</svg>
