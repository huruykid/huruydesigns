<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" width="1200" height="750" role="img" aria-labelledby="t">
  <title id="t">Abstract compliance configuration: six linked entity types and a draft, review, locked, released lifecycle</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="1" stop-color="#1e2a44"/>
    </linearGradient>
    <linearGradient id="acc" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f97415"/>
      <stop offset="1" stop-color="#fb923c"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="750" fill="url(#bg)"/>
  <g stroke="#ffffff" stroke-opacity="0.05">
    <path d="M0 150H1200M0 300H1200M0 450H1200M0 600H1200M200 0V750M400 0V750M600 0V750M800 0V750M1000 0V750"/>
  </g>
  <!-- entity chain -->
  <g font-family="Inter, Arial, sans-serif" font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle">
    <g stroke="#f97415" stroke-opacity="0.5" stroke-width="3" fill="none">
      <path d="M200 260H1000"/>
    </g>
    <g>
      <rect x="120" y="200" width="160" height="120" rx="14" fill="#111a2e" stroke="#f97415" stroke-width="3"/>
      <text x="200" y="250" fill="#fb923c" font-size="26">01</text><text x="200" y="285" fill-opacity="0.85">Tax Code</text>
    </g>
    <g>
      <rect x="320" y="200" width="160" height="120" rx="14" fill="#111a2e" stroke="#f97415" stroke-width="3"/>
      <text x="400" y="250" fill="#fb923c" font-size="26">02</text><text x="400" y="285" fill-opacity="0.85">Payee</text>
    </g>
    <g>
      <rect x="520" y="200" width="160" height="120" rx="14" fill="#111a2e" stroke="#f97415" stroke-width="3"/>
      <text x="600" y="250" fill="#fb923c" font-size="26">03</text><text x="600" y="285" fill-opacity="0.85">Formula</text>
    </g>
    <g>
      <rect x="720" y="200" width="160" height="120" rx="14" fill="#111a2e" stroke="#f97415" stroke-width="3"/>
      <text x="800" y="250" fill="#fb923c" font-size="26">04</text><text x="800" y="285" fill-opacity="0.85">Filing Frequency</text>
    </g>
    <g>
      <rect x="920" y="200" width="160" height="120" rx="14" fill="#111a2e" stroke="#f97415" stroke-width="3"/>
      <text x="1000" y="250" fill="#fb923c" font-size="26">05</text><text x="1000" y="285" fill-opacity="0.85">Holiday Calendar</text>
    </g>
  </g>
  <!-- lifecycle -->
  <g font-family="Inter, Arial, sans-serif" font-size="17" font-weight="700" text-anchor="middle">
    <text x="600" y="430" fill="#fb923c" font-size="13" letter-spacing="3">REVISION LIFECYCLE</text>
    <g>
      <rect x="180" y="470" width="190" height="72" rx="12" fill="#eab308" fill-opacity="0.18" stroke="#eab308" stroke-opacity="0.7" stroke-width="2"/>
      <text x="275" y="514" fill="#fde68a">Draft</text>
    </g>
    <path d="M370 506H410" stroke="#ffffff" stroke-opacity="0.35" stroke-width="3"/>
    <g>
      <rect x="410" y="470" width="190" height="72" rx="12" fill="#3b82f6" fill-opacity="0.18" stroke="#3b82f6" stroke-opacity="0.7" stroke-width="2"/>
      <text x="505" y="514" fill="#bfdbfe">In Review</text>
    </g>
    <path d="M600 506H640" stroke="#ffffff" stroke-opacity="0.35" stroke-width="3"/>
    <g>
      <rect x="640" y="470" width="190" height="72" rx="12" fill="#f97415" fill-opacity="0.18" stroke="#f97415" stroke-opacity="0.8" stroke-width="2"/>
      <text x="735" y="514" fill="#fed7aa">Locked</text>
    </g>
    <path d="M830 506H870" stroke="#ffffff" stroke-opacity="0.35" stroke-width="3"/>
    <g>
      <rect x="870" y="470" width="190" height="72" rx="12" fill="#22c55e" fill-opacity="0.18" stroke="#22c55e" stroke-opacity="0.7" stroke-width="2"/>
      <text x="965" y="514" fill="#bbf7d0">Released</text>
    </g>
  </g>
  <text x="600" y="640" font-family="Inter, Arial, sans-serif" font-size="18" fill="#ffffff" fill-opacity="0.55" text-anchor="middle">9,000+ tax agencies · one configuration model · UI state maps 1:1 to backend state</text>
</svg>
