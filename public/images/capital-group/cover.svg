<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" width="1200" height="750" role="img" aria-labelledby="t">
  <title id="t">Abstract analyst research workspace: a document with cited sources, a confidence marker and a review state</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="1" stop-color="#1e2a44"/>
    </linearGradient>
    <linearGradient id="acc" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f97415"/>
      <stop offset="1" stop-color="#fb923c"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="750" fill="url(#bg)"/>
  <!-- subtle grid -->
  <g stroke="#ffffff" stroke-opacity="0.05">
    <path d="M0 150H1200M0 300H1200M0 450H1200M0 600H1200M200 0V750M400 0V750M600 0V750M800 0V750M1000 0V750"/>
  </g>
  <!-- document panel -->
  <rect x="150" y="120" width="620" height="510" rx="18" fill="#111a2e" stroke="#ffffff" stroke-opacity="0.12"/>
  <rect x="190" y="165" width="260" height="16" rx="8" fill="#ffffff" fill-opacity="0.85"/>
  <rect x="190" y="200" width="420" height="10" rx="5" fill="#ffffff" fill-opacity="0.35"/>
  <rect x="190" y="222" width="500" height="10" rx="5" fill="#ffffff" fill-opacity="0.35"/>
  <rect x="190" y="244" width="380" height="10" rx="5" fill="#ffffff" fill-opacity="0.35"/>
  <!-- highlighted claim with citation markers -->
  <rect x="190" y="286" width="530" height="54" rx="10" fill="#f97415" fill-opacity="0.12" stroke="#f97415" stroke-opacity="0.5"/>
  <rect x="208" y="304" width="330" height="10" rx="5" fill="#ffffff" fill-opacity="0.7"/>
  <g font-family="Inter, Arial, sans-serif" font-size="14" font-weight="700" fill="#0f172a">
    <circle cx="590" cy="313" r="13" fill="url(#acc)"/><text x="590" y="318" text-anchor="middle">1</text>
    <circle cx="626" cy="313" r="13" fill="url(#acc)"/><text x="626" y="318" text-anchor="middle">2</text>
    <circle cx="662" cy="313" r="13" fill="url(#acc)"/><text x="662" y="318" text-anchor="middle">3</text>
  </g>
  <rect x="190" y="370" width="460" height="10" rx="5" fill="#ffffff" fill-opacity="0.35"/>
  <rect x="190" y="392" width="520" height="10" rx="5" fill="#ffffff" fill-opacity="0.35"/>
  <rect x="190" y="414" width="300" height="10" rx="5" fill="#ffffff" fill-opacity="0.35"/>
  <!-- chart -->
  <g transform="translate(190 470)">
    <rect x="0" y="0" width="530" height="120" rx="10" fill="#ffffff" fill-opacity="0.04"/>
    <polyline points="20,95 90,80 160,88 230,60 300,66 370,40 440,48 510,22" fill="none" stroke="url(#acc)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <g fill="#ffffff" fill-opacity="0.25"><rect x="20" y="104" width="490" height="2"/></g>
  </g>
  <!-- source / provenance panel -->
  <rect x="810" y="120" width="240" height="300" rx="18" fill="#111a2e" stroke="#ffffff" stroke-opacity="0.12"/>
  <text x="834" y="160" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="700" letter-spacing="2" fill="#fb923c">SOURCES</text>
  <g font-family="Inter, Arial, sans-serif" font-size="14" font-weight="700" fill="#0f172a">
    <circle cx="848" cy="200" r="13" fill="url(#acc)"/><text x="848" y="205" text-anchor="middle">1</text>
    <circle cx="848" cy="256" r="13" fill="url(#acc)"/><text x="848" y="261" text-anchor="middle">2</text>
    <circle cx="848" cy="312" r="13" fill="url(#acc)"/><text x="848" y="317" text-anchor="middle">3</text>
  </g>
  <g fill="#ffffff" fill-opacity="0.6">
    <rect x="874" y="194" width="140" height="10" rx="5"/><rect x="874" y="212" width="90" height="8" rx="4" fill-opacity="0.3"/>
    <rect x="874" y="250" width="120" height="10" rx="5"/><rect x="874" y="268" width="100" height="8" rx="4" fill-opacity="0.3"/>
    <rect x="874" y="306" width="150" height="10" rx="5"/><rect x="874" y="324" width="80" height="8" rx="4" fill-opacity="0.3"/>
  </g>
  <!-- review state -->
  <rect x="810" y="450" width="240" height="180" rx="18" fill="#111a2e" stroke="#ffffff" stroke-opacity="0.12"/>
  <text x="834" y="490" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="700" letter-spacing="2" fill="#fb923c">REVIEW</text>
  <g font-family="Inter, Arial, sans-serif" font-size="15" fill="#ffffff">
    <circle cx="846" cy="524" r="7" fill="#22c55e"/><text x="866" y="529" fill-opacity="0.9">Sources verified</text>
    <circle cx="846" cy="560" r="7" fill="#fb923c"/><text x="866" y="565" fill-opacity="0.9">Analyst review</text>
    <circle cx="846" cy="596" r="7" fill="none" stroke="#ffffff" stroke-opacity="0.4" stroke-width="2"/><text x="866" y="601" fill-opacity="0.5">Compliance sign-off</text>
  </g>
</svg>
