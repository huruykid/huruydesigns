<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Applies the saved or OS colour scheme before first paint so dark mode never flashes light. -->
    <script>
      (function () {
        var html = document.documentElement;
        try {
          var saved = localStorage.getItem("theme");
          var dark = saved ? saved === "dark" : window.matchMedia("(prefers-color-scheme: dark)").matches;
          if (dark) html.classList.add("dark");
        } catch (e) {}
        // Prerendered pages carry data-route. If a host served this file for a different
        // URL (SPA fallback), hide the stale markup until React renders the right page.
        var route = html.getAttribute("data-route");
        var here = location.pathname.replace(/\/+$/, "") || "/";
        if (route && route !== "*" && route !== here) html.classList.add("route-mismatch");
      })();
    </script>
    <style>
      .route-mismatch #root { visibility: hidden; }
    </style>
    <title>Huruy Kidanemariam | Senior UX Designer &amp; Builder</title>
    <meta name="description" content="Huruy Kidanemariam is a Senior UX Designer and Builder with 8+ years crafting accessible, human-centered products for enterprise SaaS and social impact." />
    <meta name="author" content="Huruy Kidanemariam" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#f4f5f8" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#080d1a" />
    <!-- Per-route title, description, canonical, Open Graph and JSON-LD are injected at build time
         by scripts/prerender.mjs for every public route, and kept in sync by react-helmet-async after hydration. -->
    <meta name="google-site-verification" content="KoPqufrqlSK5XZioUJfZpWzHugkc63gTIzULux0onCE" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Non-render-blocking font load: swaps in once downloaded. -->
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;700&display=swap"
      media="print"
      onload="this.media='all'"
    />
    <noscript>
      <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;700&display=swap"
      />
    </noscript>
  </head>
